  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, #BAE6FD 0%, #E0F2FE 40%, #86EFAC 70%, #4ADE80 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      direction: rtl;
      position: relative;
    }

    /* 1. Cartoon Forest Background Elements */
    .forest-background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Floating Cloud Animation */
    @keyframes float-cloud {
      0% { transform: translateX(110vw); }
      100% { transform: translateX(-20vw); }
    }
    .cloud {
      position: absolute;
      fill: #FFFFFF;
      opacity: 0.9;
      animation: float-cloud 35s linear infinite;
    }
    .cloud-1 { top: 10%; animation-duration: 45s; }
    .cloud-2 { top: 20%; animation-duration: 32s; animation-delay: -8s; }

    /* Floating Smiling Star (from user's screenshot) */
    @keyframes float-star {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(4deg); }
    }
    .star-container {
      position: absolute;
      top: 12%;
      right: 15%;
      width: 90px;
      height: 90px;
      animation: float-star 3.2s ease-in-out infinite;
    }

    /* 2. Interactive Area (Playground) */
    .playground {
      display: flex;
      gap: 100px;
      justify-content: center;
      align-items: flex-end;
      flex: 1;
      width: 100%;
      max-width: 1000px;
      z-index: 5;
      padding-bottom: 80px;
      margin-top: 110px;
    }

    .mascot-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .mascot-container {
      width: 280px;
      height: 340px;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s ease;
    }

    .mascot-container:hover {
      transform: translateY(-8px) scale(1.03);
    }

    .mascot-container:active {
      transform: translateY(2px) scale(0.97);
    }

    .label {
      margin-top: 15px;
      background: white;
      border: 4px solid #4D2B82;
      padding: 10px 32px;
      border-radius: 25px;
      font-size: 22px;
      font-weight: 900;
      color: #4D2B82;
      box-shadow: 0 6px 0px #4D2B82;
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }

    h1 {
      position: absolute;
      top: 25px;
      color: #4D2B82;
      font-size: 34px;
      font-weight: 900;
      text-shadow: 0 4px 0px rgba(255, 255, 255, 0.9);
      text-align: center;
      z-index: 10;
      width: 100%;
    }

    .eye-element {
      transform-origin: center;
      transition: transform 0.08s ease-in-out;
    }
  </style>
</head>

  <script>
    const sound = new Audio('./public/excellent.mp3');
    sound.volume = 0.5;

    function setupMascotInteraction(mascotId, armId, eyesId, shoulderX, shoulderY) {
      const mascot = document.getElementById(mascotId);
      const arm = document.getElementById(armId);
      const eyes = document.getElementById(eyesId);

      let isWaving = false;

      // 1. Natural Auto Blinking (Blinks randomly every 3-6 seconds)
      function scheduleAutoBlink() {
        const nextBlink = Math.random() * 3500 + 2500;
        setTimeout(() => {
          if (!isWaving) {
            eyes.style.transform = "scaleY(0.08)";
            setTimeout(() => {
              eyes.style.transform = "scaleY(1)";
            }, 120);
          }
          scheduleAutoBlink();
        }, nextBlink);
      }
      scheduleAutoBlink();

      // 2. Click Interaction (Blink + Wave bye-bye)
      mascot.addEventListener('click', () => {
        if (isWaving) return;
        isWaving = true;

        // Play Sound
        try {
          sound.currentTime = 0;
          sound.play().catch(() => {});
        } catch(e){}

        // Instantly blink
        eyes.style.transform = "scaleY(0.08)";
        setTimeout(() => {
          eyes.style.transform = "scaleY(1)";
        }, 120);

        // Start waving bye-bye after blink
        setTimeout(() => {
          let startTime = null;
          const waveDuration = 1800; // Wave for 1.8 seconds

          function step(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;

            if (elapsed < waveDuration) {
              // Wave hand back and forth: rotate between -16 and +16 degrees around the shoulder joint
              const angle = Math.sin(elapsed * 0.024) * 16;
              arm.setAttribute('transform', `rotate(${angle}, ${shoulderX}, ${shoulderY})`);
              requestAnimationFrame(step);
            } else {
              // Reset to normal
              arm.setAttribute('transform', `rotate(0, ${shoulderX}, ${shoulderY})`);
              isWaving = false;
            }
          }
          requestAnimationFrame(step);

        }, 180);
      });
    }

    // Setup both mascots with their exact joints
    // Apple shoulder: x=228, y=195
    // Orange shoulder: x=236, y=198
    setupMascotInteraction('apple-mascot', 'apple-right-arm', 'apple-eyes', 228, 195);
    setupMascotInteraction('orange-mascot', 'orange-right-arm', 'orange-eyes', 236, 198);
  </script>
