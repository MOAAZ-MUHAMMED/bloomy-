<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بلومي للأطفال - استعراض الشخصيات التفاعلية (باي باي)</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, #FFECA1 0%, #FCD34D 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow-x: hidden;
      direction: rtl;
    }

    h1 {
      color: #4D2B82;
      font-size: 32px;
      font-weight: 900;
      text-shadow: 0 4px 0px rgba(255, 255, 255, 0.8);
      margin-bottom: 5px;
      text-align: center;
    }

    p {
      color: #7C3AED;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 40px;
      text-align: center;
    }

    .playground {
      display: flex;
      gap: 100px;
      justify-content: center;
      align-items: flex-end;
      flex-wrap: wrap;
      max-width: 800px;
      padding: 20px;
    }

    .mascot-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      position: relative;
    }

    .mascot-wrapper {
      position: relative;
      width: 220px;
      height: 220px;
      transform-origin: bottom center;
    }

    .mascot-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 15px 10px rgba(0, 0, 0, 0.15));
      pointer-events: none;
    }

    .mascot-shadow {
      width: 140px;
      height: 20px;
      background: rgba(0, 0, 0, 0.1);
      border-radius: 50%;
      margin-top: 10px;
      filter: blur(4px);
    }

    .label {
      margin-top: 20px;
      background: white;
      border: 4px solid #4D2B82;
      padding: 8px 24px;
      border-radius: 20px;
      font-size: 20px;
      font-weight: 900;
      color: #4D2B82;
      box-shadow: 0 6px 0px #4D2B82;
      transition: transform 0.1s ease;
    }

    /* Interactive Hover Effect */
    .mascot-container:hover .label {
      transform: scale(1.05);
    }
    
    .mascot-container:active .label {
      transform: scale(0.95);
    }

    .info-footer {
      margin-top: 60px;
      font-size: 14px;
      color: #9333EA;
      font-weight: bold;
      background: white;
      padding: 10px 25px;
      border-radius: 30px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
  </style>
</head>
<body>

  <h1>استعراض تفاعلي لشخصيات بلومي (حركة باي باي) 👋</h1>
  <p>الشخصيات ثابتة الآن. اضغط عليها لتراها ترمش بوضوح وتحرك يدها فقط لتلوح لك بالسلام! 🍎🍊</p>

  <div class="playground">
    <!-- Apple Mascot -->
    <div class="mascot-container" id="apple-mascot">
      <div class="mascot-wrapper" id="apple-wrapper">
        <img class="mascot-img" id="apple-img" src="./public/assets/mascots/apple_idle.png" alt="تفاحة">
      </div>
      <div class="mascot-shadow"></div>
      <div class="label">البطل تفاحة 🍎</div>
    </div>

    <!-- Orange Mascot -->
    <div class="mascot-container" id="orange-mascot">
      <div class="mascot-wrapper" id="orange-wrapper">
        <img class="mascot-img" id="orange-img" src="./public/assets/mascots/orange_idle.png" alt="برتقالة">
      </div>
      <div class="mascot-shadow"></div>
      <div class="label">البطل برتقالة 🍊</div>
    </div>
  </div>

  <div class="info-footer">
    تم دمج صور الإطارات (Wave Left & Wave Right) لنحصل على حركة لوحة التلويح الطبيعية.
  </div>

  <script>
    const sound = new Audio('./public/excellent.mp3');
    sound.volume = 0.5;

    function initMascot(type) {
      const container = document.getElementById(`${type}-mascot`);
      const img = document.getElementById(`${type}-img`);

      let isAnimating = false;

      // Paths to pre-rendered frames
      const frames = {
        idle: `./public/assets/mascots/${type}_idle.png`,
        blink: `./public/assets/mascots/${type}_blink.png`,
        waveRight: `./public/assets/mascots/${type}_wave_right.png`,
        waveLeft: `./public/assets/mascots/${type}_wave_left.png`
      };

      container.addEventListener('click', () => {
        if (isAnimating) return;
        isAnimating = true;

        // Play sound
        try {
          sound.currentTime = 0;
          sound.play().catch(e => console.warn(e));
        } catch (e) {
          console.warn(e);
        }

        // 1. First, Blink (Eyes Closed) for 150ms
        img.src = frames.blink;

        setTimeout(() => {
          // 2. Start waving (Bye-bye arm animation)
          let waveSide = 'right';
          img.src = frames.waveRight;

          // Toggle between waveLeft and waveRight every 120ms to make the hand move back and forth
          const waveInterval = setInterval(() => {
            if (waveSide === 'right') {
              img.src = frames.waveLeft;
              waveSide = 'left';
            } else {
              img.src = frames.waveRight;
              waveSide = 'right';
            }
          }, 120);

          // 3. Stop waving after 1.8 seconds (approx 15 hand shakes) and return to idle
          setTimeout(() => {
            clearInterval(waveInterval);
            img.src = frames.idle;
            isAnimating = false;
          }, 1800);

        }, 200); // Wait 200ms after blink to start waving
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      initMascot('apple');
      initMascot('orange');
    });
  </script>
</body>
</html>
