<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بلومي للأطفال - استعراض التفاحة المتحركة المحدثة</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, #FFECA1 0%, #FCD34D 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      direction: rtl;
    }

    h1 {
      color: #4D2B82;
      font-size: 32px;
      font-weight: 900;
      text-shadow: 0 4px 0px rgba(255, 255, 255, 0.8);
      margin-bottom: 5px;
      text-align: center;
    }

    p {
      color: #7C3AED;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 30px;
      text-align: center;
      max-width: 600px;
    }

    .mascot-container {
      width: 380px;
      height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .mascot-container:active {
      transform: scale(1.05);
    }

    .info-footer {
      margin-top: 30px;
      font-size: 15px;
      color: #9333EA;
      font-weight: bold;
      background: white;
      padding: 15px 30px;
      border-radius: 30px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      text-align: center;
      max-width: 650px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <h1>بطل بلومي الكارتوني الجديد 🍎🌟</h1>
  <p>أعدنا بناء الشخصية بالكامل كملف SVG مدمج واحد لضمان مطابقة الابعاد والملامح 100% بدون أي لخطبطة، مع إيقاف الأرجل والأحذية بالأسفل!</p>

  <!-- Mascot Container -->
  <div class="mascot-container" id="mascot-card">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="100%" height="100%">
  <defs>
    <!-- Radial gradient for 3D body -->
    <radialGradient id="apple3D" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="40%" stop-color="#EE2E2E" />
      <stop offset="85%" stop-color="#B71C1C" />
      <stop offset="100%" stop-color="#7F0000" />
    </radialGradient>
    
    <!-- Glossy Highlight -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    
    <!-- Soft Drop Shadow under stem -->
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    
    <!-- Glove Gradient -->
    <radialGradient id="gloveGrad" cx="40%" cy="40%" r="60%">
      <stop offset="75%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#ECEFF1" />
    </radialGradient>
    
    <!-- Boot Gradient -->
    <radialGradient id="bootGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8D6E63" />
      <stop offset="100%" stop-color="#4E342E" />
    </radialGradient>

    <!-- Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81C784" />
      <stop offset="100%" stop-color="#4CAF50" />
    </linearGradient>

    <clipPath id="mouthClip">
      <path d="M 200 270 L 300 270 C 300 270, 290 325, 250 325 C 210 325, 200 270, 200 270 Z" />
    </clipPath>

    <!-- CSS Keyframe Animations -->
    <style>
      .breathe-group {
        animation: svg-breathe 3s ease-in-out infinite;
        transform-origin: 250px 380px;
      }
      
      .wave-group {
        animation: svg-wave 1.2s ease-in-out infinite;
        transform-origin: 360px 250px;
      }
      
      .blink-eye {
        animation: svg-blink 4s infinite;
        transform-origin: 250px 210px;
      }

      @keyframes svg-breathe {
        0%, 100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.025, 0.97);
        }
      }

      @keyframes svg-wave {
        0%, 100% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(24deg);
        }
      }

      @keyframes svg-blink {
        0%, 90%, 100% {
          transform: scaleY(1);
        }
        95% {
          transform: scaleY(0.08);
        }
      }
    </style>
  </defs>

  <!-- Mascot Stage -->
  <g id="mascot-apple-character">
    
    <!-- Legs (Rendered behind body) -->
    <g id="legs">
      <!-- Left Leg & Boot -->
      <g>
        <path d="M 200 370 L 200 440" fill="none" stroke="#212121" stroke-width="10" stroke-linecap="round"/>
        <ellipse cx="195" cy="450" rx="28" ry="16" fill="url(#bootGrad)" stroke="#212121" stroke-width="4"/>
      </g>
      <!-- Right Leg & Boot -->
      <g>
        <path d="M 300 370 L 300 440" fill="none" stroke="#212121" stroke-width="10" stroke-linecap="round"/>
        <ellipse cx="305" cy="450" rx="28" ry="16" fill="url(#bootGrad)" stroke="#212121" stroke-width="4"/>
      </g>
    </g>

    <!-- Left Arm Group (Resting on hip) -->
    <g id="left-arm">
      <path d="M 140 250 C 90 280, 70 300, 75 325" fill="none" stroke="#212121" stroke-width="10" stroke-linecap="round"/>
      <circle cx="75" cy="330" r="22" fill="url(#gloveGrad)" stroke="#212121" stroke-width="4"/>
      <path d="M 60 315 C 68 310, 82 310, 90 315" fill="none" stroke="#212121" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- Right Arm Group (Waving - Animates rotation around shoulder) -->
    <g id="right-arm" class="wave-group">
      <!-- Waving Arm path -->
      <path d="M 360 250 C 390 220, 420 190, 440 160" fill="none" stroke="#212121" stroke-width="10" stroke-linecap="round"/>
      <!-- Glove Palm & Fingers splayed open -->
      <g transform="translate(415, 115)">
        <path d="M 15 50 
                 C 10 38, 12 22, 22 24 
                 C 27 25, 25 35, 30 31
                 C 35 27, 36 10, 44 12
                 C 50 14, 45 30, 51 28
                 C 57 26, 60 14, 66 17
                 C 71 19, 65 35, 68 38
                 C 71 40, 78 35, 80 41
                 C 82 47, 71 63, 52 70
                 C 33 78, 18 60, 15 50 Z" 
              fill="url(#gloveGrad)" stroke="#212121" stroke-width="4" stroke-linejoin="round"/>
        <path d="M 25 70 C 32 75, 44 72, 50 67" fill="none" stroke="#212121" stroke-width="4" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Waving/Breathing Body Group -->
    <g id="body-group" class="breathe-group">
      <!-- Apple Body Shape -->
      <path d="M 250 130 
               C 285 105, 390 100, 420 180 
               C 450 260, 390 380, 310 405 
               C 275 420, 260 410, 250 410 
               C 240 410, 225 420, 190 405 
               C 110 380, 50 260, 80 180 
               C 110 100, 215 105, 250 130 Z" 
            fill="url(#apple3D)" stroke="#4A0000" stroke-width="7" stroke-linejoin="round"/>

      <!-- Shadow under stem -->
      <ellipse cx="250" cy="135" rx="32" ry="10" fill="url(#shadowGrad)"/>

      <!-- Premium 3D Gloss Highlight -->
      <path d="M 125 175 
               C 135 135, 205 125, 245 140 
               C 195 145, 145 165, 135 205
               C 130 195, 123 185, 125 175 Z" 
            fill="url(#glossGrad)"/>

      <!-- Stem & Leaf -->
      <g id="stem-leaf">
        <path d="M 250 140 C 248 100, 235 60, 228 40" fill="none" stroke="#5D4037" stroke-width="12" stroke-linecap="round"/>
        <path d="M 235 75 C 255 45, 295 38, 320 30 C 300 50, 275 70, 235 75 Z" 
              fill="url(#leafGrad)" stroke="#1B5E20" stroke-width="3" stroke-linejoin="round"/>
        <path d="M 235 75 C 262 61, 292 50, 320 30" fill="none" stroke="#1B5E20" stroke-width="1.5"/>
      </g>

      <!-- Eyes (Blinking Animation) -->
      <g id="eyes" class="blink-eye">
        <!-- Left Eyeball -->
        <ellipse cx="195" cy="210" rx="34" ry="50" fill="#FFFFFF" stroke="#212121" stroke-width="5"/>
        <!-- Left Pupil -->
        <ellipse cx="205" cy="210" rx="19" ry="28" fill="#212121"/>
        <circle cx="199" cy="196" r="6" fill="#FFFFFF"/>
        <circle cx="211" cy="224" r="3.5" fill="#FFFFFF"/>

        <!-- Right Eyeball -->
        <ellipse cx="305" cy="210" rx="34" ry="50" fill="#FFFFFF" stroke="#212121" stroke-width="5"/>
        <!-- Right Pupil -->
        <ellipse cx="295" cy="210" rx="19" ry="28" fill="#212121"/>
        <circle cx="289" cy="196" r="6" fill="#FFFFFF"/>
        <circle cx="301" cy="224" r="3.5" fill="#FFFFFF"/>
      </g>

      <!-- Eyebrows (Happy Curved Arches) -->
      <g id="eyebrows">
        <path d="M 160 150 C 175 125, 210 125, 225 145" fill="none" stroke="#212121" stroke-width="6" stroke-linecap="round"/>
        <path d="M 275 145 C 290 125, 325 125, 340 150" fill="none" stroke="#212121" stroke-width="6" stroke-linecap="round"/>
      </g>

      <!-- Nose (Spec-glossy button nose) -->
      <g id="nose">
        <circle cx="250" cy="245" r="16" fill="url(#noseGrad)" stroke="#4A0000" stroke-width="3"/>
        <circle cx="245" cy="239" r="4.5" fill="#FFFFFF" opacity="0.8"/>
      </g>

      <!-- Mouth (Smiling D-Shape with tooth and tongue) -->
      <g id="mouth">
        <!-- Mouth Cavity -->
        <path d="M 200 270 L 300 270 C 300 270, 290 325, 250 325 C 210 325, 200 270, 200 270 Z" 
              fill="#212121" stroke="#4A0E0E" stroke-width="4.5" stroke-linejoin="round"/>
        <!-- Clipped Inside elements -->
        <g clip-path="url(#mouthClip)">
          <!-- White Upper Tooth -->
          <path d="M 202 270 L 298 270 L 298 285 C 275 285, 225 285, 202 285 Z" fill="#FFFFFF" />
          <!-- Pink Tongue -->
          <path d="M 220 325 C 220 305, 280 305, 280 325 Z" fill="#FF8A80" stroke="#FF5252" stroke-width="1.5"/>
        </g>
      </g>

    </g>
  </g>
</svg>
  </div>

  <div class="info-footer">
    تم تصحيح تداخلات الوجه وإبراز الأرجل والأحذية بالكامل! انقر على البطل لسماع صوته المتميز!
  </div>

  <script>
    const sound = new Audio('./public/excellent.mp3');
    sound.volume = 0.5;

    const card = document.getElementById('mascot-card');
    card.addEventListener('click', () => {
      try {
        sound.currentTime = 0;
        sound.play().catch(() => {});
      } catch(e){}
    });
  </script>
</body>
</html>
